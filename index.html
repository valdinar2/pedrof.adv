<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Filho | Advocacia e Consultoria Jurídica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">

  <div id="tela-login" class="center-flex">
    <div class="card">
      <h2 class="text-blue">Acesso Restrito</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="Digite seu email...">
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Digite sua senha...">
        </div>
        <button type="submit" class="btn btn-blue">Entrar</button>
      </form>
    </div>
  </div>

  <div id="tela-dashboard" style="display: none;">
    <header class="header">
      <div class="logo">
        <img src="Logo_I_Pedro_Filho.png" alt="Logo Pedro Filho Advocacia" class="header-logo">
        <h2>Pedro Filho Advocacia e Consultoria Jurídica</h2>
      </div>
      <div class="user-info">
        <span>Dr. Pedro Filho</span>
        <button onclick="fazerLogout()" class="btn btn-outline-sm">Sair</button>
      </div>
    </header>

    <main class="container">
      <section class="quick-actions">
        <h2>Funções Principais</h2>
        <div class="actions-grid">
          <button class="btn btn-blue" onclick="openModal('modal-cliente')">+ Cadastrar Cliente</button>
          <button class="btn btn-blue" onclick="openModal('modal-anotacao')">+ Nova Anotação</button>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">Total de Clientes</span>
          <span class="stat-number" id="count-clientes">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">Anotações Registradas</span>
          <span class="stat-number" id="count-anotacoes">0</span>
        </div>
      </section>

      <section class="search-section">
        <input type="text" id="input-busca" placeholder="Buscar cliente por nome ou CPF..." onkeyup="filtrarClientes()">
      </section>

      <section class="section">
        <h3 class="section-title">Clientes Cadastrados</h3>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CPF/CNPJ</th>
                <th>Telefone</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista-clientes"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <h3 class="section-title">Últimas Anotações e Lembretes</h3>
        <div id="lista-anotacoes" class="notes-grid"></div>
      </section>
    </main>

    <div id="modal-cliente" class="modal">
      <div class="modal-content">
        <h3>Cadastrar Novo Cliente</h3>
        <div class="form-group">
          <label for="cli-nome">Nome Completo</label>
          <input type="text" id="cli-nome" placeholder="Ex: Pr Leandro Moura">
        </div>
        <div class="form-group">
          <label for="cli-cpf">CPF ou CNPJ</label>
          <input type="text" id="cli-cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
          <label for="cli-tel">Telefone / WhatsApp</label>
          <input type="text" id="cli-tel" placeholder="(89) 90000-0000">
        </div>
        <div class="modal-actions">
          <button class="btn btn-blue" onclick="salvarCliente()">Salvar Cliente</button>
          <button class="btn btn-outline-dark" onclick="closeModal('modal-cliente')">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="modal-anotacao" class="modal">
      <div class="modal-content">
        <h3>Adicionar Anotação</h3>
        <div class="form-group">
          <label for="anot-cliente">Nome do Cliente</label>
          <input type="text" id="anot-cliente" placeholder="Ex: Wesley Santos">
        </div>
        <div class="form-group">
          <label for="anot-texto">Detalhes da Anotação</label>
          <textarea id="anot-texto" rows="4" placeholder="Escreva o andamento do processo..."></textarea>
        </div>
        <div class="form-group">
          <label for="anot-arquivos">Anexar Documentos</label>
          <input type="file" id="anot-arquivos" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
        </div>
        <div class="modal-actions">
          <button class="btn btn-blue" onclick="salvarAnotacao()">Salvar Anotação</button>
          <button class="btn btn-outline-dark" onclick="closeModal('modal-anotacao')">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
